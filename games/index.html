<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Games · Tool Studio</title><link rel="stylesheet" href="./styles.css"></head>
<body><header><a class="brand" href="../index.html" id="studioLink">∑ <span>tool studio</span></a><span class="section-label">Games</span><a href="../guide.html" id="guideLink">Studio guide</a></header>
<main><section class="intro"><p class="eyebrow">A LITTLE PLAY TIME</p><h1>Take a small break.</h1><p>Four familiar games. Pick one and play at your own pace.</p></section>
<nav aria-label="Choose a game" id="gamePicker"><button data-game="2048" aria-pressed="true">2048 <small>Slide & merge</small></button><button data-game="snake" aria-pressed="false">Snake <small>Find your rhythm</small></button><button data-game="memory" aria-pressed="false">Memory Match <small>Find eight pairs</small></button><button data-game="ttt" aria-pressed="false">Tic-tac-toe <small>Solo or together</small></button></nav>
<section class="play-card" aria-labelledby="gameTitle"><div class="game-heading"><div><p class="eyebrow" id="gameTag"></p><h2 id="gameTitle">2048</h2></div><button id="restart">New game</button></div><p id="instructions"></p><div id="gameOptions"></div><p id="gameStatus" role="status" aria-live="polite"></p><div id="board" role="group" tabindex="0" aria-label="Game board"></div><div id="gameControls"></div><p class="hint" id="keyboardHint"></p></section>
<p class="footnote">No sign-in. No ads. Games run on this device. Scores reset with a new game.</p></main><script type="module" src="./app.js"></script></body></html>
