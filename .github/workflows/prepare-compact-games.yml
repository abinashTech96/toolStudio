name: Prepare compact Games published files
on:
  push:
    branches: [codex/compact-game-settings]
permissions:
  contents: write
jobs:
  publish-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compact-game-settings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run publish:root
      - name: Commit generated files and remove preparation workflow
        run: |
          rm .github/workflows/prepare-compact-games.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish compact Games settings online and offline'
          git push origin HEAD:codex/compact-game-settings
