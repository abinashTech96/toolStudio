name: Prepare v42 Games assets
on:
  push:
    branches: [codex/more-games-v42]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run publish:root
      - run: npm run check
      - run: npm run test:budgets
      - run: node scripts/check.mjs --published
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build v42 Games and offline assets'
          git push origin HEAD:codex/more-games-v42
