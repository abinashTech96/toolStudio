name: Prepare v35.02 review assets
on:
  push:
    branches: [codex/games-brain]
permissions:
  contents: write
concurrency:
  group: v35-02-prepare-review
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run publish:root
      - run: npm run check
      - run: npm run test:games
      - run: npm run test:home-extras
      - run: npm run test:updates
      - run: npm run test:budgets
      - run: node scripts/check.mjs --published
      - name: Commit verified generated files
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish verified v35.02 Games and Home build'
          git push origin HEAD:refs/heads/codex/games-brain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-02-validation
          path: test-results/
