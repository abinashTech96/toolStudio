name: Prepare v35.05 Career Studio review
on:
  push:
    branches: [codex/career-simplify]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run publish:root
      - run: npm run check
      - run: npm run test:career
      - run: npm run test:connection
      - run: npm run test:budgets
      - run: node scripts/check.mjs --published
      - run: git diff --check
      - name: Commit generated Pages files on the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build v35.05 consolidated Career Studio review artifacts"
          git push origin HEAD:codex/career-simplify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-review-results
          path: test-results/
