name: Prepare PDF and UI review artifacts
on:
  push:
    branches: [codex/pdf-review-responsive-ui]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run publish:root
      - run: npm run check
      - run: npm run test:pdf-ui
      - run: npm run test:connection
      - run: npm run test:budgets
      - run: node scripts/check.mjs --published
      - run: git diff --check
      - name: Commit generated review artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build v37.00 PDF review and responsive UI artifacts"
            git push origin HEAD:codex/pdf-review-responsive-ui
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-ui-preparation-results
          path: test-results/
