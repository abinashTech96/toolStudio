name: Validate Tool Studio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    if: github.ref != 'refs/heads/codex/career-simplify' && github.head_ref != 'codex/career-simplify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run test:home
      - run: npm run test:home-extras
      - run: npm run test:games
      - run: npm run test:connection
      - run: npm run test:career
      - run: npm run test:navigation
      - run: npm run test:advanced
      - run: npm run test:reliability
        env:
          BROWSER_MATRIX: chromium,firefox,webkit
      - run: npm run test:updates
      - run: npm run test:budgets
      - run: npm run test:compatibility
      - run: python3 -m pip install -r Connection_Server/requirements.txt
      - run: python3 tests/server.py
      - run: node scripts/check.mjs --published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: test-results/
