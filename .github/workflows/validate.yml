name: Validate Tool Studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:connection
      - run: npm run check
      - run: npm test
      - run: npm run test:home
      - run: npm run test:home-redesign
      - run: npm run test:home-extras
      - run: npm run test:games
      - run: npm run test:v40
      - run: npm run test:v39
      - run: npm run test:workflows
      - run: node scripts/dependency-inventory.mjs --check
      - run: npm run test:guided
      - run: npm run test:career
      - run: npm run test:navigation
      - run: npm run test:advanced
      - run: npm run test:reliability
        env:
          BROWSER_MATRIX: chromium
      - run: npm run test:updates
      - run: npm run test:coverage
      - run: npm run test:budgets
      - run: npm run test:compatibility
      - run: python3 -m pip install -r Connection_Server/requirements.txt
      - run: python3 tests/server.py
      - run: node scripts/check.mjs --published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: test-results/

  pdf-ui:
    name: PDF and UI (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      REVIEW_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx playwright install --with-deps "${{ matrix.browser }}" ${{ matrix.browser == 'webkit' && 'chromium' || '' }}
      - run: npm run build
      - run: npm run test:connection
      - run: npm run test:home-redesign
      - run: npm run test:games-extra
      - run: npm run test:arcade
      - run: npm run test:play-setup
      - run: npm run test:pdf-ui
      - run: npm run test:reliability
        env:
          BROWSER_MATRIX: ${{ matrix.browser }}
      - run: npm run test:v40
      - run: npm run test:v39
      - run: npm run test:workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-ui-${{ matrix.browser }}
          path: test-results/
