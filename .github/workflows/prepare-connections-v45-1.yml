name: Prepare Connection patch published files
on:
  push:
    branches: [codex/connections-failure-diagnostics-v45.1]
permissions:
  contents: write
jobs:
  publish-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/connections-failure-diagnostics-v45.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run publish:root
      - name: Commit generated files and remove this one-time workflow
        run: |
          rm .github/workflows/prepare-connections-v45-1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Connection failure diagnostics v45.0.1'
          git push origin HEAD:codex/connections-failure-diagnostics-v45.1
