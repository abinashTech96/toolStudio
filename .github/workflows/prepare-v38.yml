name: Prepare v38 generated release files
on:
  push:
    branches: [codex/unified-workflows-v38]
    paths: [.github/workflows/prepare-v38.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/unified-workflows-v38'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run publish:root
      - run: npm run check && npm run test:budgets && node scripts/check.mjs --published
      - name: Commit generated files to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Generate v38 hosted and offline release files'
            git push origin HEAD:codex/unified-workflows-v38
          fi

