name: Prepare verified review branch
on:
  push:
    branches: [codex/home-navigation-improvements]
permissions:
  contents: write
concurrency:
  group: toolstudio-prepare-review
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run publish:root
      - run: npm run check
      - run: npm test
      - run: npm run test:home
      - run: npm run test:navigation
      - run: npm run test:advanced
      - run: npm run test:reliability
        env:
          BROWSER_MATRIX: chromium,firefox,webkit
      - run: npm run test:updates
      - run: npm run test:budgets
      - run: npm run test:compatibility
      - run: python3 -m pip install -r Connection_Server/requirements.txt
      - run: python3 tests/server.py
      - run: node scripts/check.mjs --published
      - name: Commit verified generated assets to review branch
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish verified Home and navigation build'
          git push origin HEAD:refs/heads/codex/home-navigation-improvements
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-regression-results
          path: test-results/
