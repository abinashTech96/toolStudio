name: Prepare v45 published files
on:
  push:
    branches: [codex/connections-guided-v45]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/connections-guided-v45
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run publish:root
      - name: Commit generated pages and remove this one-off workflow
        run: |
          rm .github/workflows/prepare-connections-v45.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Generate v45 GitHub Pages and standalone files'
          git push origin HEAD:codex/connections-guided-v45
