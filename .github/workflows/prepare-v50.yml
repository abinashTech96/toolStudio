name: Prepare v50 published files
on:
  push:
    branches: [codex/v50-toolstudio-upgrade]
permissions:
  contents: write
jobs:
  publish-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v50-toolstudio-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run publish:root
      - name: Commit generated files and remove preparation workflow
        run: |
          rm .github/workflows/prepare-v50.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish ToolStudio v50 online and offline files'
          git push origin HEAD:codex/v50-toolstudio-upgrade
