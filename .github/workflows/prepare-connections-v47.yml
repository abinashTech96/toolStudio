name: Prepare guided QR published files
on:
  push:
    branches: [codex/guided-qr-v47]
permissions:
  contents: write
jobs:
  publish-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/guided-qr-v47
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run publish:root
      - name: Commit generated files and remove this one-time workflow
        run: |
          rm .github/workflows/prepare-connections-v47.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish guided Connection QR v47'
          git push origin HEAD:codex/guided-qr-v47
