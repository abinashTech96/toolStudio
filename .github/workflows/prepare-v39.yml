# Final reviewed helper changes and optional-policy migration validation.
name: Prepare v39 generated files
on:
  push:
    branches: [codex/v39-existing-system]
    paths: [.github/workflows/prepare-v39.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-v39
  cancel-in-progress: true
jobs:
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run publish:root
      - run: npm run check
      - run: npm run test:budgets
      - run: node scripts/check.mjs --published
      - name: Commit generated hosted and standalone files to this review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Generate final reviewed v39 hosted and offline files'
            git push origin HEAD:codex/v39-existing-system
          fi
