<section id="notebook" class="extra-panel" hidden aria-label="Calculation notebook"><div class="panel-heading"><h2>Calculation notebook</h2><div class="row"><button class="small" id="notebookExample">Example</button><button class="small" id="notebookExport">Export</button></div></div><p class="hint">One expression per line. Assign variables with <code>price = 250</code>; use them on later lines. Results update as you edit.</p><div class="session-toolbar"><select id="sessionSelect" aria-label="Notebook session"></select><input id="sessionName" class="session-name" value="Main" maxlength="80" aria-label="Session name"><button id="sessionNew" class="small">New</button><button id="sessionRename" class="small">Rename</button><button id="sessionDelete" class="small">Delete</button></div><label class="pane-controls">Editor width <input id="notebookSplit" type="range" min="25" max="75" value="55" aria-label="Notebook editor width"></label><div class="notebook-grid" id="notebookGrid"><label class="field"><span>Editable lines</span><textarea id="notebookInput" spellcheck="false" aria-label="Notebook expressions"></textarea></label><div><div class="field-label">Results by line</div><div id="notebookOutput" class="notebook-output" aria-live="polite"></div></div></div><p class="hint">Variables are case insensitive. Lines run top to bottom. Use # for comments. Trigonometry follows the calculator's DEG/RAD setting.</p></section>
<!-- /fragment:notebook -->
