<section id="matrices" class="extra-panel" hidden aria-label="Matrix and vector calculator"><div class="panel-heading"><h2>Matrices & vectors</h2></div><label class="field"><span>Operation</span><select id="matrixOperation"><option value="multiply">Matrix A × B</option><option value="add">Matrix A + B</option><option value="subtract">Matrix A − B</option><option value="transpose">Transpose A</option><option value="determinant">Determinant of A</option><option value="inverse">Inverse of A</option><option value="dot">Vector dot product</option><option value="cross">3D vector cross product</option></select></label><div class="fields" style="margin-top:10px"><label class="field"><span>A: rows on separate lines; entries comma/space separated</span><textarea id="matrixA" rows="3" spellcheck="false">1, 2
