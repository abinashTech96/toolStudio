<!-- fragment:calculator -->
<section id="calculator" role="region" aria-label="Calculator"><div class="panel-heading"><h1>Calculator</h1><div class="row"><button class="small" id="scientificToggle" aria-pressed="true" aria-controls="sciencePad">Scientific</button><button class="small" id="angleMode" title="Switch angle unit">DEG</button></div></div>
<div class="display"><div class="display-head"><span class="eyebrow">Edit your expression</span><span class="eyebrow"><i class="live-dot"></i>Live preview</span></div><textarea id="expression" aria-label="Editable calculation expression" rows="1" placeholder="e.g. sin(30) × 12" spellcheck="false" autocomplete="off"></textarea><div class="result-row"><output id="result" aria-label="Calculation result" aria-live="polite">0</output><button class="small" id="copyResult" title="Copy result" aria-label="Copy result">⧉</button></div><div class="status" id="status" role="status"></div></div>
<div class="memory"><button class="small" data-memory="clear" title="Clear memory">MC</button><button class="small" data-memory="recall" title="Recall memory">MR</button><button class="small" data-memory="store" title="Store result in memory">MS</button><button class="small" data-memory="add" title="Add result to memory">M+</button><button class="small" data-memory="subtract" title="Subtract result from memory">M−</button><span class="memory-label" id="memoryLabel">M: empty</span></div>
<div class="keypads" id="keypads"><div class="pad scientific-pad" id="sciencePad"></div><div class="pad" id="numberPad"></div></div><p class="hint">Click anywhere in the expression to edit · <kbd>Enter</kbd> saves · <kbd>Esc</kbd> clears · <b>%</b> means ÷ 100</p>
</section>
<!-- /fragment:calculator -->

<!-- fragment:numberwords -->
<section id="numberwords" class="extra-panel v9-panel" hidden aria-label="Number to words"><div class="panel-heading"><h2>Number to words</h2></div><div class="fields"><label class="field"><span>Number / amount</span><input id="wordsAmount" type="text" value="1234567.89" ></label><label class="field"><span>Numbering</span><select id="wordsSystem"><option value="indian">Indian: lakh / crore</option><option value="international">International: million / billion</option></select></label><label class="field"><span>Currency label</span><select id="wordsCurrency"><option value="INR">INR · rupees</option><option value="USD">USD · dollars</option><option value="EUR">EUR · euros</option><option value="GBP">GBP · pounds</option><option value="none">Plain number</option></select></label></div><div class="developer-toolbar"><button id="wordsConvert" class="small" >Convert</button><button id="wordsCopy" class="small" disabled>Copy words</button></div><p id="wordsStatus" class="hint" role="status" aria-live="polite"></p><label class="field"><span>Amount in words</span><textarea id="wordsOutput" class="developer-editor" rows="5" spellcheck="false" readonly ></textarea></label><p class="hint">Plain decimal input, up to 15 integer digits and 2 decimal places. No rounding or currency conversion is performed.</p></section>
<!-- /fragment:numberwords -->
