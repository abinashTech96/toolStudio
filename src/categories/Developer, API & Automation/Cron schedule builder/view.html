<!-- fragment:cron -->
<section id="cron" class="extra-panel" hidden aria-label="Cron schedule builder"><div class="panel-heading"><h2>Cron schedule builder</h2><button id="cronClear" class="small">Clear</button></div><div class="fields"><select id="cronMode" class="small" aria-label="cronMode"><option value="standard">Standard cron (5 fields)</option><option value="salesforce">Salesforce Apex (6 / 7 fields)</option></select><select id="cronPreset" class="small" aria-label="cronPreset"><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="hourly">Hourly</option></select><label class="field"><span>Hour (0–23)</span><input id="cronHour" value="9" placeholder="" spellcheck="false"></label><label class="field"><span>Minute (0–59)</span><input id="cronMinute" value="0" placeholder="" spellcheck="false"></label><label class="field"><span>Day of month (1–31)</span><input id="cronDay" value="1" placeholder="" spellcheck="false"></label><label class="field"><span>Weekday (0=Sunday … 6=Saturday)</span><input id="cronWeekday" value="1" placeholder="" spellcheck="false"></label></div><div class="row"><button id="cronBuild" class="small" >Build expression</button></div><label class="field"><span>Editable cron expression</span><input id="cronExpression" value="" placeholder="0 9 * * *" spellcheck="false"></label><div class="fields"><label class="field"><span>IANA timezone</span><input id="cronZone" value="Asia/Kolkata" placeholder="" spellcheck="false"></label><label class="field"><span>Preview after UTC date/time</span><input id="cronStart" value="" placeholder="Blank = now" spellcheck="false"></label></div><div class="row"><button id="cronPreview" class="small" >Preview next 5 runs</button><button id="cronCopy" class="small" >Copy expression</button></div><div id="cronResults" class="diff-results"></div><p id="cronStatus" class="hint developer-status" role="status">Supports *, lists, ranges, steps, month/day names, and Salesforce ?. Advanced L/W/# rules are explicitly rejected. Previews are estimates, not job execution guarantees.</p></section>
<!-- /fragment:cron -->
