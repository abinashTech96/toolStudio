<section id="programmer" class="extra-panel" hidden aria-label="Programmer calculator"><div class="panel-heading"><h2>Programmer calculator</h2></div><div class="fields"><label class="field"><span>Input base</span><select id="programBase"><option value="10">Decimal</option><option value="2">Binary</option><option value="16">Hexadecimal</option><option value="8">Octal</option></select></label><label class="field"><span>Word size (unsigned)</span><select id="programWidth"><option>8</option><option>16</option><option selected>32</option><option>64</option></select></label><label class="field full"><span>A</span><input id="programA" value="255" spellcheck="false"></label><label class="field"><span>Operation</span><select id="programOperation"><option value="identity">Convert A</option><option value="and">A AND B</option><option value="or">A OR B</option><option value="xor">A XOR B</option><option value="not">NOT A</option><option value="shl">A &lt;&lt; B</option><option value="shr">A &gt;&gt; B (logical)</option><option value="add">A + B</option><option value="sub">A − B</option><option value="mul">A × B</option><option value="div">A ÷ B (integer)</option><option value="mod">A remainder B</option></select></label><label class="field" id="programBField"><span id="programBLabel">B (same input base)</span><input id="programB" value="1" spellcheck="false"></label></div><div id="programResults" class="metrics" aria-live="polite"></div><p class="hint">Integers use BigInt. Results wrap to the chosen unsigned word size. Input overflow is rejected. Shift counts are decimal, from 0 to word size − 1.</p></section>
