<section id="presentationtimer" class="extra-panel cs-panel" hidden aria-label="Presentation Timer"><div class="panel-heading"><h2>Presentation Timer</h2></div><p class="cs-intro">Run speaker segments with countdown, overtime, elapsed tracking and colour warnings.</p><div class="fields"><label class="field"><span>Segments — one “Name | minutes” per line</span><textarea id="ptSegments" >Introduction | 2
Main presentation | 5
Questions | 3</textarea></label><label class="field"><span>Warning threshold (seconds)</span><input id="ptWarning" type="number" value="30" min="0" max="600"></label></div><div class="row"><button class="small" id="ptLoad" >Load segments</button><button class="small" id="ptStart" >Start / resume</button><button class="small" id="ptPause" >Pause</button><button class="small" id="ptReset" >Reset segment</button><button class="small" id="ptNext" >Next segment</button><button class="small" id="ptFull" >Fullscreen</button></div><div id="ptStage" class="cs-timer"><h3 id="ptName">Introduction</h3><time id="ptClock">02:00</time><p id="ptElapsed">Elapsed 00:00 · Total 00:00</p><button id="ptStagePause" class="small">Pause / resume</button><button id="ptStageNext" class="small">Next segment</button></div><p id="ptAgenda" class="cs-help"></p><p id="presentationtimerStatus" class="developer-status" role="status"></p></section>
<!-- /fragment:presentationtimer -->
