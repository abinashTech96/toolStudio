<section id="videoframes" class="extra-panel cs-panel" hidden aria-label="Video Frame Extractor"><div class="panel-heading"><h2>Video Frame Extractor</h2></div><p class="cs-intro">Capture a frame at a timestamp or extract a sequence into individual PNGs and a ZIP.</p><label class="field"><span>Choose file</span><input id="vidFile" type="file" value="" accept="video/*" ></label><div class="cs-stage"><video id="vidPlayer" controls playsinline></video></div><div class="fields"><label class="field"><span>Timestamp (seconds)</span><input id="vidTime" type="number" value="0" min="0" step="0.01"></label><label class="field"><span>Interval start</span><input id="vidStart" type="number" value="0" min="0" step="0.01"></label><label class="field"><span>Interval end</span><input id="vidEnd" type="number" value="0" min="0" step="0.01"></label><label class="field"><span>Interval (seconds)</span><input id="vidStep" type="number" value="5" min="0.1" step="0.1"></label></div><div class="row"><button class="small" id="vidCapture" disabled>Capture timestamp</button><button class="small" id="vidCurrent" disabled>Capture current frame</button><button class="small" id="vidExtract" disabled>Extract interval</button><button class="small" id="vidCancel" disabled>Cancel</button><button class="small" id="vidZip" disabled>Download ZIP</button><button class="small" id="vidClear" >Clear frames</button></div><div id="vidFrames" class="cs-grid"></div><p class="cs-help">Up to 100 frames per session. Capture precision and playable formats depend on the browser.</p><p id="videoframesStatus" class="developer-status" role="status"></p></section>
<!-- /fragment:videoframes -->
