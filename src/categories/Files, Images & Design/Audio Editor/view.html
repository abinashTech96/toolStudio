<section id="audioeditor" class="extra-panel cs-panel" hidden aria-label="Audio Trimmer &amp; Editor"><div class="panel-heading"><h2>Audio Trimmer &amp; Editor</h2></div><p class="cs-intro">Select a section, adjust its volume and fades, then preview and export PCM WAV.</p><label class="field"><span>Choose file</span><input id="audFile" type="file" value="" accept="audio/*" ></label><div class="cs-stage"><canvas id="audWave" width="1000" height="180" class="cs-canvas" aria-label="Click or drag to select audio"></canvas><audio id="audPlayer" controls></audio></div><div class="fields"><label class="field"><span>Start (seconds)</span><input id="audStart" type="number" value="0" min="0" step="0.01"></label><label class="field"><span>End (seconds)</span><input id="audEnd" type="number" value="0" min="0" step="0.01"></label><label class="field"><span>Volume (%)</span><input id="audGain" type="number" value="100" min="0" max="300"></label><label class="field"><span>Fade in (seconds)</span><input id="audIn" type="number" value="0" min="0" step="0.1"></label><label class="field"><span>Fade out (seconds)</span><input id="audOut" type="number" value="0" min="0" step="0.1"></label></div><div class="row"><button class="small" id="audPreview" disabled>Preview edit</button><button class="small" id="audDownload" disabled>Download WAV</button></div><p class="cs-help">Drag across the waveform to set the selection. Decoding depends on browser codec support. WAV exports preserve the decoded sample rate and channels.</p><p id="audioeditorStatus" class="developer-status" role="status"></p></section>
<!-- /fragment:audioeditor -->
