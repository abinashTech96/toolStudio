<section id="formulas" class="extra-panel" hidden aria-label="Saved reusable formulas"><div class="panel-heading"><h2>Saved formulas</h2><div class="row"><button class="small" id="formulaNew">New</button><button class="small" id="formulaExport">Export JSON</button><button class="small" id="formulaImport">Import</button><input id="formulaImportFile" type="file" accept=".json,application/json" hidden></div></div><label class="field"><span>Your formulas</span><select id="formulaSelect"></select></label><div class="fields" style="margin-top:14px"><label class="field"><span>Name</span><input id="formulaName" value="Total price" maxlength="80"></label><label class="field"><span>Input names (comma separated)</span><input id="formulaVariables" value="price, qty, tax"></label><label class="field full"><span>Expression</span><input id="formulaExpression" value="price * qty * (1 + tax/100)" spellcheck="false"></label></div><div class="row" style="margin-top:12px"><button class="small" id="formulaSave">Save formula</button><button class="small" id="formulaDelete">Delete saved formula</button><span id="formulaStatus" class="hint"></span></div><div id="formulaInputs" class="fields three-fields" style="margin-top:18px"></div><div id="formulaResults" class="metrics" aria-live="polite"></div><p class="hint">Change the input values to reuse a formula. Variables are case insensitive. Export a backup before moving to another browser.</p></section>
