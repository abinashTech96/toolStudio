<!-- fragment:shortcuts -->
<section id="shortcuts" class="extra-panel v9-panel" hidden aria-label="URL shortcuts"><div class="panel-heading"><h2>URL shortcuts</h2></div><div class="fields"><label class="field"><span>Shortcut name</span><input id="shortcutName" type="text" value="" ></label><label class="field"><span>URL</span><input id="shortcutURL" type="text" value="" placeholder="https://example.com"></label><label class="field"><span>Group</span><input id="shortcutGroup" type="text" value="General" ></label></div><label class="field"><span>Notes</span><input id="shortcutNotes" type="text" value="" ></label><div class="developer-toolbar"><label><input id="shortcutFavorite" type="checkbox"> Favorite</label><button id="shortcutSave" class="small" >Add shortcut</button><button id="shortcutCancel" class="small" disabled>Cancel edit</button></div><div class="fields"><label class="field"><span>Search names, URLs, and notes</span><input id="shortcutSearch" type="text" value="" ></label><label class="field"><span>Group</span><select id="shortcutFilter"><option value="">All groups</option></select></label><label class="field"><span>Sort</span><select id="shortcutSort"><option value="name">Name</option><option value="group">Group</option><option value="newest">Newest first</option></select></label></div><div class="developer-toolbar"><label><input id="shortcutOnlyFavorites" type="checkbox"> Favorites only</label><button id="shortcutExport" class="small" >Export shortcuts</button><button id="shortcutImport" class="small" >Import JSON</button><input id="shortcutFile" type="file" accept=".json,.txt" hidden><button id="shortcutDeleteAll" class="small" >Delete all</button></div><p id="shortcutStatus" class="hint" role="status" aria-live="polite"></p><div id="shortcutList" class="v9-results"></div><p class="hint">Shortcuts save in this browser when storage is available. Export JSON to move them between devices. Imports merge without replacing existing URLs. Only HTTP/HTTPS links are allowed; links open in a new tab without previews or tracking requests.</p></section>
<!-- /fragment:shortcuts -->
